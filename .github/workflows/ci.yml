name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 20
          - 22
        include:
          - os: ubuntu-latest
            node-version: 24
            npm-version: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Match publishing npm version
        if: matrix.npm-version
        run: npm install -g npm@${{ matrix.npm-version }}

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check

      - name: Pack unbuilt sources and test the installed example
        run: npm run pack:smoke

      - name: Build
        run: npm run build
