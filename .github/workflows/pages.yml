name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for the documented package version
        shell: bash
        run: |
          NAME="$(node -p "encodeURIComponent(require('./package.json').name)")"
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "https://registry.npmjs.org/${NAME}/${VERSION}"; then
              echo "Package ${VERSION} is available; deploying its documentation"
              exit 0
            fi
            echo "Waiting for package ${VERSION} before updating the quickstart (${attempt}/30)"
            sleep 20
          done
          echo "::error::Package ${VERSION} is not published; keeping the existing site"
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
